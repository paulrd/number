[package]
name = "regions-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Host-only tool. It never becomes a WASM artifact, so its dependencies do not
# affect any contract id. Deliberately std-only for process/sqlite handling:
# the exporter drives the `sqlite3` CLI rather than pulling a native SQLite
# binding, so CI needs no C toolchain.
[workspace]

[dependencies]
blake3 = "=1.8.7"
bs58 = "=0.5.1"
ed25519-dalek = "=2.1.1"
hex = "=0.4.3"
region-wire = { path = "../wire" }
serde_json = "=1.0.149"

[[bin]]
name = "regions-tool"
path = "src/main.rs"
