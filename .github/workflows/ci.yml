name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FREENET_VERSION: "0.2.151"

jobs:
  contract:
    name: Contract (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to match rust-toolchain.toml; byte equality depends on the exact rustc.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Check and test
        working-directory: contract
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  delegate:
    name: Delegate (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: delegate
      - name: Check and test
        working-directory: delegate
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  reproducible:
    name: Reproducible WASM (byte equality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      # No Swatinem/rust-cache and no cached target dir here on purpose:
      # a stale or cached target dir changes the emitted WASM bytes.
      - name: Check committed WASM artifacts
        run: ./scripts/check-artifacts.sh

  ui:
    name: UI (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Unit tests
        working-directory: ui
        run: npm test

  e2e-offline:
    name: UI browser smoke (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: ui
        run: npm run test:e2e:offline
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: ui/test-results
          retention-days: 7

  merge-laws:
    name: Merge laws (fdev verify-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Install fdev
        run: |
          set -euo pipefail
          mkdir -p /tmp/fdev
          cd /tmp/fdev
          curl -sSL "https://github.com/freenet/freenet-core/releases/download/v${FREENET_VERSION}/fdev-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m 0755 fdev /usr/local/bin/fdev
          fdev --version
      - name: Verify merge laws
        env:
          FDEV: fdev
        run: make verify-merge
